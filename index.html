<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RxVault — Dr. Imran Khan Muhammadi</title>

<meta name="theme-color" content="#061419">
<meta name="description" content="Prescription collection by Dr. Imran Khan Muhammadi - Medical Faculty 2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RxVault">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" type="image/png" href="./icon-512.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/jetbrains-mono@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/playfair-display@latest/index.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #05121a;
  --bg-secondary: #0a1b24;
  --bg-tertiary: #0f2632;
  --bg-card: #132f3d;
  --bg-card-hover: #183a4a;
  --bg-elevated: #1d4558;
  --text-primary: #f1f5f9;
  --text-secondary: #a8c5d1;
  --text-muted: #6b8a99;
  --text-dim: #4a6775;
  --accent: #06b6d4;
  --accent-hover: #22d3ee;
  --accent-dim: rgba(6, 182, 212, 0.12);
  --accent-glow: rgba(6, 182, 212, 0.3);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --gold: #d4a574;
  --gold-dim: rgba(212, 165, 116, 0.15);
  --border: #1a3544;
  --border-hover: #2a5163;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 40px rgba(6, 182, 212, 0.15);
}

html, body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(6,182,212,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 85%, rgba(16,185,129,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(212,165,116,0.03) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(6, 182, 212, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(6, 182, 212, 0.015) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
  z-index: 0;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

.app {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: 290px;
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(20px);
}

.sidebar-header {
  padding: 22px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
}

.logo {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--success));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 4px 16px var(--accent-glow);
  position: relative;
  overflow: hidden;
}

.logo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

.logo-text h1 {
  font-size: 17px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-hover), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}

.logo-text p {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  font-weight: 500;
}

.search-bar {
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--border);
}

.search-input-wrap {
  position: relative;
}

.search-input-wrap input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s;
}

.search-input-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
  background: var(--bg-card);
}

.search-input-wrap input::placeholder { color: var(--text-dim); }

.search-input-wrap .search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 13px;
}

.search-input-wrap .kbd-hint {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 9px;
  color: var(--text-dim);
  background: var(--bg-card);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
}

.category-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.category-list::-webkit-scrollbar { width: 6px; }
.category-list::-webkit-scrollbar-track { background: transparent; }
.category-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.category-list::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

.cat-section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--text-dim);
  padding: 14px 12px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.cat-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

.cat-item {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 12px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-secondary);
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  margin-bottom: 2px;
  position: relative;
  font-weight: 500;
}

.cat-item:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  transform: translateX(2px);
}

.cat-item.active {
  background: linear-gradient(135deg, var(--accent-dim), rgba(6, 182, 212, 0.05));
  color: var(--accent-hover);
  font-weight: 600;
  box-shadow: inset 0 0 0 1px rgba(6, 182, 212, 0.2);
}

.cat-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  top: 20%;
  bottom: 20%;
  width: 3px;
  background: linear-gradient(180deg, var(--accent), var(--success));
  border-radius: 0 3px 3px 0;
}

.cat-item .cat-icon {
  font-size: 17px;
  flex-shrink: 0;
  width: 24px;
  text-align: center;
}

.cat-item .cat-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cat-item .cat-count {
  font-size: 10px;
  background: var(--bg-tertiary);
  color: var(--text-muted);
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}

.cat-item.active .cat-count {
  background: linear-gradient(135deg, var(--accent), var(--success));
  color: white;
}

.about-card {
  margin: 10px;
  padding: 14px;
  background: linear-gradient(135deg, var(--gold-dim), rgba(6, 182, 212, 0.03));
  border: 1px solid rgba(212, 165, 116, 0.25);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.25s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.about-card:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(212, 165, 116, 0.15);
}

.about-card .doctor-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #b8956a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
  object-fit: cover;
}

.about-card .doctor-info { flex: 1; min-width: 0; }

.about-card .doctor-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold);
  margin-bottom: 2px;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.about-card .doctor-title {
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
}

.about-card .arrow {
  color: var(--gold);
  font-size: 16px;
  opacity: 0.6;
  transition: all 0.2s;
}

.about-card:hover .arrow {
  opacity: 1;
  transform: translateX(3px);
}

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.sync-status {
  flex: 1;
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.3px;
}

.sync-status .sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
  box-shadow: 0 0 8px var(--success);
}

.sync-status .sync-dot.offline { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.sync-status .sync-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.sync-status .sync-dot.loading {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ============ MAIN ============ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.topbar {
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(10, 27, 36, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.toggle-sidebar-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-size: 16px;
}

.toggle-sidebar-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.topbar-title {
  flex: 1;
  min-width: 0;
}

.topbar-title h2 {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: -0.3px;
}

.topbar-title h2 .back-arrow {
  color: var(--accent);
  font-size: 16px;
  transition: transform 0.2s;
}

.topbar-title h2 .back-arrow:hover {
  transform: translateX(-3px);
}

.topbar-title p {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 3px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.3px;
}

.topbar-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.topbar-btn {
  padding: 8px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.topbar-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.topbar-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.topbar-btn .spinner {
  width: 12px;
  height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.menu-container {
  position: relative;
}

.menu-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
  letter-spacing: 2px;
}

.menu-btn:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
  min-width: 240px;
  box-shadow: var(--shadow-lg);
  z-index: 100;
  display: none;
  backdrop-filter: blur(20px);
  animation: menuFade 0.2s ease;
}

@keyframes menuFade {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

.dropdown-menu.show { display: block; }

.dropdown-item {
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 11px;
  transition: all 0.15s;
  font-weight: 500;
}

.dropdown-item:hover {
  background: var(--bg-card-hover);
  color: var(--text-primary);
}

.dropdown-item .di-icon {
  width: 22px;
  text-align: center;
  font-size: 15px;
}

.dropdown-item .di-label { flex: 1; }

.dropdown-item .di-badge {
  font-size: 9px;
  background: linear-gradient(135deg, var(--accent), var(--success));
  color: white;
  padding: 2px 7px;
  border-radius: 8px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  scroll-behavior: smooth;
}

.content::-webkit-scrollbar { width: 8px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.content::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* ============ WELCOME ============ */
.welcome {
  max-width: 1100px;
  margin: 0 auto;
  animation: fadeInUp 0.5s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.welcome-hero {
  text-align: center;
  padding: 48px 30px 56px;
  margin-bottom: 36px;
  background: linear-gradient(135deg, rgba(6,182,212,0.06), rgba(212,165,116,0.04));
  border: 1px solid var(--border);
  border-radius: 24px;
  position: relative;
  overflow: hidden;
}

.welcome-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(212,165,116,0.06) 0%, transparent 60%);
  animation: rotate 30s linear infinite;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.welcome-hero > * { position: relative; z-index: 1; }

.doctor-avatar-large {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #b8956a);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  margin: 0 auto 24px;
  box-shadow: 0 12px 40px rgba(212, 165, 116, 0.35), 0 0 0 4px rgba(212, 165, 116, 0.1);
  object-fit: cover;
  position: relative;
}

.doctor-avatar-large::after {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px dashed rgba(212, 165, 116, 0.3);
  animation: rotate 20s linear infinite reverse;
}

.welcome h1 {
  font-size: 38px;
  font-weight: 700;
  margin-bottom: 10px;
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  letter-spacing: -0.5px;
  line-height: 1.1;
}

.welcome .doctor-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 500;
}

.welcome .doctor-graduation {
  font-size: 13px;
  color: var(--text-secondary);
  margin: 16px auto 24px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 24px;
  font-weight: 500;
}

.welcome .doctor-bio {
  max-width: 640px;
  margin: 0 auto;
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.7;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 36px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
}

.stat-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
  box-shadow: var(--shadow-glow);
}

.stat-card:hover::before { transform: scaleX(1); }

.stat-card .stat-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.stat-card .stat-value {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent-hover), var(--success));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: -1px;
}

.stat-card .stat-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-top: 4px;
  font-weight: 600;
}

/* ============ PRESCRIPTION GRID ============ */
.rx-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
  animation: fadeInUp 0.5s ease;
}

.rx-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.rx-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px;
  padding: 1px;
  background: linear-gradient(135deg, transparent, transparent);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  transition: background 0.3s;
  pointer-events: none;
}

.rx-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow-lg), var(--shadow-glow);
}

.rx-card:hover::before {
  background: linear-gradient(135deg, var(--accent), var(--success));
}

.rx-card-image {
  height: 150px;
  background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-elevated));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  position: relative;
  overflow: hidden;
}

.rx-card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.rx-card-image .rx-icon-fallback {
  font-size: 64px;
  opacity: 0.85;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}

.rx-card-image::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.4) 100%);
}

/* ============ REGIMEN SELECTOR ============ */
.regimen-selector {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}

.regimen-selector-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.regimen-selector-header h3 {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.regimen-selector-header h3::before {
  content: '';
  width: 3px;
  height: 14px;
  background: linear-gradient(180deg, var(--accent), var(--success));
  border-radius: 2px;
}

.regimen-count {
  font-size: 11px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-tertiary);
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 600;
}

.regimen-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: thin;
}

.regimen-tabs::-webkit-scrollbar { height: 4px; }
.regimen-tabs::-webkit-scrollbar-track { background: transparent; }
.regimen-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.regimen-tab {
  flex-shrink: 0;
  padding: 12px 18px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 180px;
  position: relative;
  overflow: hidden;
}

.regimen-tab:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
}

.regimen-tab.active {
  background: linear-gradient(135deg, var(--accent-dim), rgba(6, 182, 212, 0.05));
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), 0 8px 20px var(--accent-glow);
}

.regimen-tab.active::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--success));
}

.regimen-tab-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.regimen-tab.active .regimen-tab-label {
  color: var(--accent-hover);
}

.regimen-tab-label .regimen-number {
  width: 22px;
  height: 22px;
  background: var(--bg-card);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
}

.regimen-tab.active .regimen-tab-label .regimen-number {
  background: var(--accent);
  color: white;
}

.regimen-tab-desc {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.4;
  margin-top: 2px;
}

.regimen-tab-meta {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  font-size: 10px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

.regimen-tab-meta span {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  background: var(--bg-card);
  border-radius: 5px;
}

.regimen-tab.active .regimen-tab-meta span {
  background: rgba(6, 182, 212, 0.15);
  color: var(--accent-hover);
}

/* ============ REGIMEN CONTENT ============ */
.regimen-content {
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============ HIGHLIGHTED NOTES ============ */
.clinical-highlights {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.04), rgba(245, 158, 11, 0.03));

}

}

.clinical-highlights-header {

  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.clinical-highlights-header h3 {

.highlights-list {

}

.highlight-item {

}

}

.highlight-item.severity-critical .highlight-severity {

  color: var(--danger);
}

.highlight-item.severity-warning .highlight-severity {
  background: rgba(245, 158, 11, 0.2);
  color: var(--warning);
}

.highlight-item.severity-info .highlight-severity {
  background: var(--accent-dim);

}

.highlight-item.severity-success .highlight-severity {

}

.highlight-content { flex: 1; min-width: 0; }

.highlight-label {
  font-size: 10px;

}

.highlight-item.severity-critical .highlight-label { color: var(--danger); }

.highlight-item.severity-success .highlight-label { color: var(--success); }

.highlight-text {

// ==================== PERSISTENCE ====================
function saveState() {
  try {
    const data = {
      prescriptions: state.prescriptions,
      categories: state.categories,
      viewMode: state.viewMode,
      lastSync: state.lastSync,
      lastSyncStatus: state.lastSyncStatus,
      activeRegimen: state.activeRegimen
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error('Save error:', e);
    return false;
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      state.prescriptions = data.prescriptions || [];
      state.categories = data.categories || state.categories;
      state.viewMode = data.viewMode || 'grid';
      state.lastSync = data.lastSync || null;
      state.lastSyncStatus = data.lastSyncStatus || 'idle';
      state.activeRegimen = data.activeRegimen || {};
    }
  } catch (e) {
    console.error('Load error:', e);
  }
}

function updateSyncStatus() {
  const dot = document.querySelector('#syncStatus .sync-dot');
  const text = document.getElementById('syncText');
  if (!dot || !text) return;
  
  if (state.lastSyncStatus === 'success') {
    dot.className = 'sync-dot';
    text.textContent = `Updated ${formatTimeAgo(state.lastSync)}`;
  } else if (state.lastSyncStatus === 'offline') {
    dot.className = 'sync-dot offline';
    text.textContent = 'Offline mode';
  } else if (state.lastSyncStatus === 'error') {
    dot.className = 'sync-dot error';
    text.textContent = 'Using cached data';
  } else if (state.lastSyncStatus === 'loading') {
    dot.className = 'sync-dot loading';
    text.textContent = 'Syncing...';
  } else {
    dot.className = 'sync-dot';
    text.textContent = 'Not synced';
  }
}

// ==================== UTILITIES ====================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function formatTimeAgo(ts) {
  if (!ts) return 'never';
  const seconds = Math.floor((Date.now() - ts) / 1000);
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  return Math.floor(seconds / 86400) + 'd ago';
}

function getCategoryById(id) {
  return state.categories.find(c => c.id === id) || { id: 'cat_other', name: 'Other', icon: '📋' };
}

function getCategoryCount(catId) {
  return state.prescriptions.filter(r => r.categoryId === catId).length;
}

function getTotalRegimens() {
  return state.prescriptions.reduce((sum, r) => sum + (r.regimens?.length || 0), 0);
}

function getTotalMedications() {
  return state.prescriptions.reduce((sum, r) => {
    return sum + (r.regimens || []).reduce((s, reg) => s + (reg.medications?.length || 0), 0);
  }, 0);
}

function getActiveRegimen(rx) {
  const regimens = rx.regimens || [];
  if (regimens.length === 0) return null;
  const activeId = state.activeRegimen[rx.id];
  const found = regimens.find(r => r.id === activeId);
  return found || regimens[0];
}

// ==================== REMOTE SYNC ====================
async function refreshFromServer() {
  const btn = document.getElementById('refreshBtn');
  if (btn) btn.disabled = true;
  
  state.lastSyncStatus = 'loading';
  updateSyncStatus();
  
  try {
    const response = await fetch(REMOTE_URL + '?t=' + Date.now());
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const data = await response.json();
    
    let remotePrescriptions = [];
    let remoteCategories = [];
    
    if (data.prescriptions && Array.isArray(data.prescriptions)) {
      remotePrescriptions = data.prescriptions;
      remoteCategories = data.categories || [];
    } else if (Array.isArray(data)) {
      remotePrescriptions = data;
    } else if (data.name) {
      remotePrescriptions = [normalizeRxData(data)];
    }
    
    remoteCategories.forEach(cat => {
      const existing = state.categories.find(c => c.id === cat.id);
      if (existing) {
        Object.assign(existing, cat);
      } else {
        state.categories.push(cat);
      }
    });
    
    state.prescriptions = state.prescriptions.filter(p => !p.isRemote);
    
    remotePrescriptions.forEach(rp => {
      const normalized = normalizeRxData(rp);
      normalized.isRemote = true;
      state.prescriptions.push(normalized);
    });
    
    state.lastSync = Date.now();
    state.lastSyncStatus = 'success';
    saveState();
    renderCategoryList();
    renderContent();
    updateSyncStatus();
    
    toast(`Synced ${remotePrescriptions.length} prescription${remotePrescriptions.length !== 1 ? 's' : ''}`, 'success');
  } catch (err) {
    console.error('Sync error:', err);
    // Use sample data if nothing loaded yet
    if (state.prescriptions.length === 0) {
      state.prescriptions = SAMPLE_DATA.prescriptions.map(p => ({...p, isRemote: false}));
      state.lastSyncStatus = 'offline';
      toast('Using sample data (server unavailable)', 'warning');
    } else {
      state.lastSyncStatus = 'offline';
      toast('Sync failed: ' + err.message, 'error');
    }
    saveState();
    renderCategoryList();
    renderContent();
    updateSyncStatus();
  } finally {
    const btn = document.getElementById('refreshBtn');
    if (btn) btn.disabled = false;
  }
}

function normalizeRxData(data) {
  const name = data.name || data.title || data.disease || 'Untitled';
  
  let categoryId = data.categoryId;
  if (!categoryId && data.category) {
    const existing = state.categories.find(c => c.name.toLowerCase() === data.category.toLowerCase());
    if (existing) {
      categoryId = existing.id;
    } else {
      categoryId = 'cat_other';
    }
  }
  if (!categoryId) categoryId = 'cat_other';
  
  // Normalize regimens - support both new format (regimens[]) and legacy (prescriptions[])
  let regimens = [];
  if (Array.isArray(data.regimens) && data.regimens.length > 0) {
    regimens = data.regimens.map((reg, idx) => ({
      id: reg.id || ('reg_' + (idx + 1)),
      name: reg.name || reg.title || `Regimen ${idx + 1}`,
      type: reg.type || '',
      description: reg.description || '',
      duration: reg.duration || '',
      medications: (reg.medications || []).map(m => ({
        name: m.name || m.medication || m.drug || '',
        brand: m.brand || m.brands || '',
        dose: m.dose || m.strength || '',
        route: m.route || m.form || 'Oral',
        frequency: m.frequency || m.freq || '',
        duration: m.duration || m.when || '',
        sig: m.sig || m.dosage || m.instructions || '',
        icon: m.icon || '💊'
      })).filter(m => m.name),
      highlights: (reg.highlights || reg.notes || []).map(h => {
        if (typeof h === 'string') {
          return { severity: 'info', label: 'Note', text: h };
        }
        return {
          severity: h.severity || 'info',
          label: h.label || h.type || 'Note',
          text: h.text || h.message || ''
        };
      }),
      followUp: reg.followUp || reg.followup || ''
    }));
  } else if (Array.isArray(data.prescriptions) && data.prescriptions.length > 0) {
    // Legacy format: convert to single regimen
    regimens = [{
      id: 'reg_1',
      name: 'Standard Regimen',
      type: 'Standard',
      description: '',
      duration: '',
      medications: data.prescriptions.map(p => ({
        name: p.name || p.medication || p.drug || '',
        brand: p.brand || p.brands || '',
        dose: p.dose || '',
        route: p.route || 'Oral',
        frequency: p.frequency || '',
        duration: p.duration || '',
        sig: p.sig || p.dosage || p.instructions || '',
        icon: p.icon || '💊'
      })).filter(m => m.name),
      highlights: (data.highlights || data.notes || []).map(h => {
        if (typeof h === 'string') return { severity: 'info', label: 'Note', text: h };
        return {
          severity: h.severity || 'info',
          label: h.label || 'Note',
          text: h.text || h.message || ''
        };
      }),
      followUp: data.followUp || data.followup || ''
    }];
  }
  
  return {
    id: data.id || ('rx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8)),
    name,
    categoryId,
    icon: data.icon || data.emoji || '💊',
    image: data.image || data.imageData || null,
    patient: {
      age: data.patient?.age || data.age || '',
      gender: data.patient?.gender || data.gender || '',
      notes: data.patient?.notes || ''
    },
    summary: data.summary || data.description || data.info || '',
    regimens,
    createdAt: data.createdAt || Date.now(),
    updatedAt: data.updatedAt || Date.now()
  };
}

// ==================== RENDERING ====================
function renderCategoryList() {
  const container = document.getElementById('categoryList');
  const allCount = state.prescriptions.length;
  
  let html = `
    <div class="cat-section-title">Library</div>
    <div class="cat-item ${state.currentView === 'all' ? 'active' : ''}" onclick="setView('all')">
      <span class="cat-icon">📋</span>
      <span class="cat-name">All Prescriptions</span>
      <span class="cat-count">${allCount}</span>
    </div>
    <div class="cat-section-title">Categories</div>
  `;
  
  state.categories.forEach(cat => {
    const count = getCategoryCount(cat.id);
    if (count === 0) return;
    html += `
      <div class="cat-item ${state.currentView === 'category:' + cat.id ? 'active' : ''}" onclick="setView('category:${cat.id}')">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${escapeHtml(cat.name)}</span>
        <span class="cat-count">${count}</span>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function renderContent() {
  const content = document.getElementById('content');
  const topbarTitle = document.getElementById('topbarTitle');
  const topbarSubtitle = document.getElementById('topbarSubtitle');
  
  if (state.currentView === 'about') {
    renderAboutView();
    topbarTitle.innerHTML = '<span class="back-arrow" style="cursor:pointer" onclick="setView(\'all\')">←</span> About the Doctor';
    topbarSubtitle.textContent = 'Medical Faculty, 2026';
    return;
  }
  
  if (state.currentView.startsWith('detail:')) {
    const id = state.currentView.split(':')[1];
    const rx = state.prescriptions.find(r => r.id === id);
    if (rx) {
      renderDetailView(rx);
      topbarTitle.innerHTML = `<span class="back-arrow" style="cursor:pointer" onclick="setView('all')">←</span> ${escapeHtml(rx.name)}`;
      const activeReg = getActiveRegimen(rx);
      topbarSubtitle.textContent = activeReg ? `${activeReg.name} • Regimen ${rx.regimens.indexOf(activeReg) + 1} of ${rx.regimens.length}` : 'Prescription Details';
    } else {
      state.currentView = 'all';
      renderContent();
    }
    return;
  }
  
  const list = getFilteredPrescriptions();
  
  if (state.currentView === 'all') {
    topbarTitle.innerHTML = '📋 All Prescriptions';
    topbarSubtitle.textContent = `${list.length} prescription${list.length !== 1 ? 's' : ''} • ${getTotalRegimens()} regimens${state.searchQuery ? ` • matching "${state.searchQuery}"` : ''}`;
  } else if (state.currentView.startsWith('category:')) {
    const catId = state.currentView.split(':')[1];
    const cat = getCategoryById(catId);
    topbarTitle.innerHTML = `${cat.icon} ${escapeHtml(cat.name)}`;
    topbarSubtitle.textContent = `${list.length} prescription${list.length !== 1 ? 's' : ''}`;
  }
  
  if (list.length === 0) {
    if (state.searchQuery) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">🔍</div>
          <h3>No results found</h3>
          <p>Try a different search term</p>
        </div>
      `;
    } else {
      content.innerHTML = renderWelcome();
    }
    return;
  }
  
  if (state.viewMode === 'grid') {
    content.innerHTML = `<div class="rx-grid">${list.map(renderRxCard).join('')}</div>`;
  } else {
    content.innerHTML = `<div class="rx-list-view">${list.map(renderRxListItem).join('')}</div>`;
  }
}

function renderWelcome() {

// ==================== FILTERING ====================
function getFilteredPrescriptions() {
  let list = [...state.prescriptions];
  
  if (state.currentView.startsWith('category:')) {
    const catId = state.currentView.split(':')[1];
    list = list.filter(r => r.categoryId === catId);
  }
  
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    list = list.filter(r => {
      if ((r.name || '').toLowerCase().includes(q)) return true;
      if ((r.summary || '').toLowerCase().includes(q)) return true;
      if ((r.patient?.age || '').toLowerCase().includes(q)) return true;
      if ((r.patient?.gender || '').toLowerCase().includes(q)) return true;
      // Search within regimens
      return (r.regimens || []).some(reg => {
        if ((reg.name || '').toLowerCase().includes(q)) return true;
        if ((reg.description || '').toLowerCase().includes(q)) return true;
        return (reg.medications || []).some(m =>
          (m.name || '').toLowerCase().includes(q) ||
          (m.brand || '').toLowerCase().includes(q) ||
          (m.sig || '').toLowerCase().includes(q)
        ) || (reg.highlights || []).some(h =>
          (h.text || '').toLowerCase().includes(q) ||
          (h.label || '').toLowerCase().includes(q)
        );
      });
    });
  }
  
  list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return list;
}

// ==================== VIEW MANAGEMENT ====================
function setView(view) {
  state.currentView = view;
  closeAllMenus();
  renderCategoryList();
  renderContent();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
  window.scrollTo(0, 0);
}

function setViewMode(mode) {
  state.viewMode = mode;
  saveState();
  document.getElementById('gridViewBtn').classList.toggle('active', mode === 'grid');
  document.getElementById('listViewBtn').classList.toggle('active', mode === 'list');
  renderContent();
}

function openDetail(id) {
  state.currentView = 'detail:' + id;
  renderContent();
  window.scrollTo(0, 0);
}

function selectRegimen(rxId, regimenId) {
  if (!state.activeRegimen) state.activeRegimen = {};
  state.activeRegimen[rxId] = regimenId;
  saveState();
  renderContent();
}

function handleSearch(query) {
  state.searchQuery = query;
  if (state.currentView.startsWith('detail:') || state.currentView === 'about') {
    state.currentView = 'all';
  }
  renderCategoryList();
  renderContent();
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
}

// ==================== MENU ====================
function toggleMenu(e) {
  e.stopPropagation();
  const menu = e.currentTarget.nextElementSibling;
  document.querySelectorAll('.dropdown-menu.show').forEach(m => {
    if (m !== menu) m.classList.remove('show');
  });
  menu.classList.toggle('show');
}

function closeAllMenus() {
  document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.menu-container')) {
    closeAllMenus();
  }
});

// ==================== MODAL ====================
function openModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});

// ==================== TOAST ====================
function toast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `
    <span class="toast-icon">${icons[type] || icons.info}</span>
    <span class="toast-message">${escapeHtml(message)}</span>
  `;
  container.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, 3000);
}

// ==================== SERVICE WORKER ====================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW failed:', err));
  });
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeModal();
    closeAllMenus();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    const active = document.activeElement;
    if (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA') {
      e.preventDefault();
      document.getElementById('searchInput').focus();
    }
  }
});

// ==================== INIT ====================
async function init() {
  loadState();
  
  // If no data, load sample data
  if (state.prescriptions.length === 0) {
    state.prescriptions = SAMPLE_DATA.prescriptions.map(p => ({...p, isRemote: false}));
    saveState();
  }
  
  renderCategoryList();
  renderContent();
  updateSyncStatus();
  
  // Try to sync from server
  await refreshFromServer();
}

init();
</script>
